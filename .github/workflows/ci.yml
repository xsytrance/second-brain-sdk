name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest tests/ -v --cov=second_brain_sdk --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install linters
        run: |
          pip install black isort mypy
      - name: Check formatting (black)
        run: black --check second_brain_sdk/ tests/ examples/
      - name: Check imports (isort)
        run: isort --check-only second_brain_sdk/ tests/ examples/
      - name: Type check (mypy)
        run: mypy second_brain_sdk/

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Check twine
        run: twine check dist/*
      # Uncomment to auto-publish to PyPI on tag push
      # - name: Publish to PyPI
      #   run: |
      #     twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
